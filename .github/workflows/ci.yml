name: CI

# D-13（V0.7）：push 到 upgrade 与 指向 upgrade 的 PR 时在 Ubuntu 跑全门禁。
# - 不跑 visual：参照机是 Windows，Linux 字体渲染会出现 11 处固定差异（V0.4 门禁证据）。
# - 不含任何 secrets / .env 内容：JWT_SECRET、ENCRYPTION_KEY 由 tests/e2e/global-setup.ts 内部生成
#   （tests/e2e/fixtures/env.ts 的 e2e-* 值，仅用于 e2e.db，非真实凭据）。
# - V0.7 追加：密钥扫描步骤 `git grep -nE ...`（排除 docs/**），有输出即失败；不新增依赖。
on:
  push:
    branches: [upgrade]
  pull_request:
    branches: [upgrade]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 测试期固定值；都是 ≥32 位的 e2e 测试占位（非真实凭据），global-setup 会按 e2e.db 覆盖 DATABASE_URL/JWT_SECRET/ENCRYPTION_KEY。
      # 必要性：Next build 阶段会运行 instrumentation.register() → assertProductionEnv()（NODE_ENV=production 时缺失即 exit 1）。
      NODE_ENV: test
      JWT_SECRET: e2e-jwt-secret-0123456789abcdef-0123456789abcdef
      ENCRYPTION_KEY: e2e-encryption-key-0123456789abcdef-0123456789abcdef
      DATABASE_URL: file:./prisma/ci-build.db
      APP_ORIGIN: http://127.0.0.1:6789
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # V9-CI-01：构建前让 ci-build.db 就绪。
      # 因果（V0.9 取证）：Build 期静态导出（如 /about 的 generateMetadata → getWebSettings）
      # 会真实查库；ci-build.db 是全新文件，不 migrate 就是 P2039 no such table: main.Setting。
      # 本地从未复现，因为本地 dev.db 已 migrate——这是典型的「本地能跑 ≠ 干净环境能跑」。
      # 与 visual job 的 Prepare DB 同口径：先准备库，再构建。
      - name: Prepare build DB
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Asset / root guards
        run: npm run check:assets && npm run check:root

      # V8-SEC-04：安全审计门禁。
      # 关键点（都是踩过坑才写下的）：
      # 1) 强制官方 registry —— 国内镜像（npmmirror）不实现 /-/npm/v1/security/advisories/bulk，
      #    会返回 404，而 npm audit --json 会把它解析成「无漏洞」。V0.7 曾因此误判为 0 漏洞。
      # 2) 接口异常必须判失败 —— 脚本会检查返回体是否有 metadata.vulnerabilities，没有即 exit 1。
      # 3) 只升不降 —— 对传递依赖，audit 的 fixAvailable.version 给的是上游父包版本，
      #    可能低于当前已装版本（例如建议 eslint-config-next 从 16.4.2 降到 14.2.35）。
      #    脚本把这类列为「降级建议」不计入失败，符合项目 Q1 授权。
      - name: Security audit gate
        run: npm run check:audit

      - name: Secret scan
        run: |
          set -o pipefail
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})' -- ':!docs/**' ':!.github/workflows/**' > /tmp/secret-scan.txt; then
            echo "::error::检测到疑似密钥，CI 失败"; cat /tmp/secret-scan.txt; exit 1
          fi
          echo "密钥扫描通过（无命中）"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (Linux)
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: .cache/e2e/
          if-no-files-found: ignore
          retention-days: 7
  # ══════════════════════════════════════════════════════════════
  # V8-VIS-02：Linux visual 像素回归
  #
  # 为什么必须单独一个 job 且用官方 playwright 镜像：
  #   1. visual 参照图（tests/visual/reference/*.png，45 张）生成于 Linux/CI；
  #      Windows 上字体渲染/图片解码差异无法与真实样式差异分离
  #      （V0.7 实测：19 pass / 26 fail，全部是"高度 5529 vs 3389"这类数据量或渲染差异）。
  #   2. 官方镜像内已预装匹配版本的浏览器与系统字体，避免 `playwright install --with-deps` 的漂移。
  #
  # 关键顺序（V8-VIS-01 实测结论）：**必须先 seed 再 clean build**。
  #   首页是静态预渲染（○ /），且 getHomeData 的 unstable_cache 配 revalidate: false
  #   （只靠 tag 失效）。seed 直写 DB 不走 API → 不触发标签失效
  #   → 若不 clean build，visual 会拿到旧数据，结果毫无意义。
  #
  # continue-on-error：V8-VIS-03 完成差异分诊前，本 job 失败不阻断主门禁。
  # ══════════════════════════════════════════════════════════════
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true   # V8-VIS-03 完成后改为 false
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
      options: --ipc=host
    env:
      NODE_ENV: production
      JWT_SECRET: visual-jwt-secret-0123456789abcdef-0123456789abcdef
      ENCRYPTION_KEY: visual-encryption-key-0123456789abcdef-0123456789abcdef
      APP_ORIGIN: http://127.0.0.1:6789
      DATABASE_URL: file:./prisma/dev.db
      # 容器内 AI 助手 / telemetry 不必要
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prepare DB
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed-visual.ts --check || npx tsx prisma/seed-visual.ts

      - name: Clean build (必须清缓存，否则静态页拿旧数据)
        run: |
          rm -rf .next/cache/fetch-cache
          npm run build

      - name: Start server
        run: |
          npx next start -p 6789 > /tmp/visual-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:6789/api/health > /dev/null; then echo "server ready"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:6789/api/health || (cat /tmp/visual-server.log; exit 1)

      - name: Visual regression
        run: VISUAL_BASE_URL=http://127.0.0.1:6789 npx playwright test -c playwright.config.ts

      - name: Upload visual diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ github.run_id }}
          path: |
            .cache/visual/
            /tmp/visual-server.log
          if-no-files-found: ignore
          retention-days: 14
  # ══════════════════════════════════════════════════════════════
  # V9-CI-01：Docker 镜像构建 + 探活（解除 V8-REL-01 的本机阻塞）
  #
  # 背景（V0.9 取证）：REL-01 已完成 Dockerfile 静态核验（11 项全过），但本机
  # 容器内无法访问任何 npm registry（npm ci 阶段超时，官方源与 npmmirror 均不通，
  # 属宿主网络环境限制非镜像缺陷）。GitHub runner 出网正常，在这里跑真实构建。
  #
  # 验证点：三阶段镜像能完整 build（npm ci / prisma generate / next build），
  # 容器以非 root 启动且 /api/health 返回 200（含 DB 探活 SELECT 1）。
  # env 四键为 e2e 测试占位（≥32 位假值，非真实凭据）；DATABASE_URL 指向
  # 容器内数据目录（Dockerfile 已预建 /app/data/db）。不推镜像，无 registry 凭据。
  # ══════════════════════════════════════════════════════════════
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JWT_SECRET: e2e-jwt-secret-0123456789abcdef-0123456789abcdef
      ENCRYPTION_KEY: e2e-encryption-key-0123456789abcdef-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hdwebsite:ci .

      - name: Run container + health check
        run: |
          docker run -d --name hd-ci \
            -p 6789:6789 \
            -e DATABASE_URL="file:/app/data/db/ci-docker.db" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e ENCRYPTION_KEY="$ENCRYPTION_KEY" \
            -e APP_ORIGIN="http://127.0.0.1:6789" \
            hdwebsite:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:6789/api/health > /dev/null; then echo "container ready"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:6789/api/health || (docker logs hd-ci; exit 1)
          docker logs hd-ci 2>&1 | tail -20

      - name: Cleanup
        if: always()
        run: docker rm -f hd-ci || true
